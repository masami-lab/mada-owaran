<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご質問・ご感想 | 妄想博士の研究所</title>
<style>
body {
  margin: 0;
  font-family: "Meiryo", sans-serif;
  background: #f3f6fa;
  color: #263746;
}
header {
  background: #102b3a;
  color: white;
  padding: 25px 20px;
  text-align: center;
}
header h1 { margin: 0; }
header p { margin-bottom: 0; }
main {
  max-width: 720px;
  margin: 40px auto;
  padding: 35px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0001;
}
h2 { color: #173f58; }
.message {
  line-height: 1.9;
  margin-bottom: 30px;
}
label {
  display: block;
  margin-top: 20px;
  font-weight: bold;
}
input, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 8px;
  border: 1px solid #bbc7d0;
  border-radius: 6px;
  font-size: 16px;
}
textarea { min-height: 180px; }
button {
  margin-top: 25px;
  padding: 13px 35px;
  background: #174d70;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
button:hover { background: #0e354f; }
.note {
  font-size: 13px;
  color: #667783;
  line-height: 1.7;
  margin-top: 25px;
}
.back {
  text-align: center;
  margin-top: 30px;
}
a { color: #17618a; }
@media (max-width: 600px) {
  main { margin: 20px 12px; padding: 22px; }
}
</style>
</head>
<body>

<header>
  <h1>まだ、終わらん‼️</h1>
  <p>妄想博士の研究所</p>
</header>

<main>
  <h2>ご質問・ご感想はこちら！</h2>

  <div class="message">
    ご覧いただき、ありがとうございます！<br>
    作品へのご感想、ご質問、ご意見など、
    どんなことでもお気軽にお寄せください。<br>
    皆さんからのメッセージを楽しみにしております！
  </div>

  <form action="https://formspree.io/f/xdeeyggz" method="POST">

    <label for="name">お名前・ニックネーム（任意）</label>
    <input type="text" id="name" name="name"
           placeholder="ニックネームでもOKです">

    <label for="email">メールアドレス（任意）</label>
    <input type="email" id="email" name="email"
           placeholder="返信が必要な場合に入力してください">

    <label for="message">メッセージ（必須）</label>
    <textarea id="message" name="message"
              placeholder="ご質問・ご感想をお聞かせください"
              required></textarea>

    <button type="submit">メッセージを送信する</button>
  </form>

  <p class="note">
    ※お寄せいただいた情報は、メッセージへの対応のためにのみ使用します。
    個人情報や秘密にしたい情報は入力しないようお願いいたします。
  </p>

  <div class="back">
    <a href="index.html">トップページへ戻る</a>
  </div>
</main>

<script data-goatcounter="https://dr-mousou.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  
</body>
</html>
